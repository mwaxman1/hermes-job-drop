# Example filled-in config. Copy the parts you want into ~/.hermes/jobdrop/config.yaml.
# Mixes a hosted provider with a local one to show both shapes. Keys come from env vars.
version: 1
models:
  vision:
    model: "claude-sonnet-5-5"
    provider: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    temperature: 0.2
  tooling:
    model: "claude-haiku-5-5"
    provider: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
  browser:
    model: "claude-opus-5-5"
    provider: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    # Or let an external coding agent drive the browser instead:
    # command: "claude --model claude-opus-5-5"
  python:
    model: "claude-sonnet-5-5"
    provider: "anthropic"
  resume:
    model: "qwen3:14b"
    provider: "ollama"
    base_url: "http://localhost:11434"
    temperature: 0.3
  cover_letter:
    model: "claude-opus-5-5"
    provider: "anthropic"
    temperature: 0.6
